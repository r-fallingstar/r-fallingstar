name: Update Activity Card

on:
  schedule:
    # 毎日 UTC 0:00 (JST 9:00) に自動更新
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Japanese Activity Card
        run: python scripts/generate_activity_card.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-card-ja.svg
          if git diff --staged --quiet; then
            echo "No changes in activity card."
          else
            git commit -m "chore: auto-update activity card"
            git push
          fi

